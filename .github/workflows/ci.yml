name: CI

# Quality gate for the Novalis monorepo (apps/v2). Runs on every pull
# request, whatever it targets, and on direct pushes to main.
#
# The base filter used to be `branches: [main]`, which meant a PR stacked
# on another feature branch got no quality run at all — the checks list
# showed only Vercel, and nothing said the gate had been skipped. A check
# that silently does not run is worse than one that fails, so the filter
# is gone: every PR is gated, and stacking costs a little CI time instead
# of coverage.
#
# Only `quality` (lint / typecheck / test / build) is a required check in
# branch protection, so `audit` failing does NOT block a merge — it is red
# whenever an unfixable upstream advisory is outstanding. Read what it
# actually lists every time before waving it through; Lesson 29 is exactly
# the case where "the audit is always red" hid four Next.js advisories,
# one of them an authorization bypass.
#
# No secrets by design: the test suite self-skips live-API tests, and the
# build reads env lazily at runtime. Migration drift is checked without
# database access — tests/unit/migration-manifest.test.ts compares the
# manifest against supabase/migrations/, and the running app compares that
# manifest against the database (P0-B).
#
# Branch protection itself is configured in the GitHub repo settings.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads the version from the root package.json
      # "packageManager" field (pnpm@10.33.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter v2 lint

      - name: Typecheck
        run: pnpm --filter v2 typecheck

      # Live Gemini integration tests self-skip unless RUN_LIVE_GEMINI=1, so
      # the suite is deterministic and secret-free in CI.
      - name: Test
        run: pnpm --filter v2 test

      # Build validates the Next production compile. Env is read lazily at
      # runtime (not build time), so no secrets are required here.
      - name: Build
        run: pnpm --filter v2 build

  audit:
    name: dependency audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Report-only in practice (not a required check). Green as of
      # 2026-09-13: next 16.3.5 pulls sharp ^0.35.4, and brace-expansion is
      # held on its own major by version-scoped overrides (1.1.18 / 5.0.9)
      # instead of forcing everything to 5.x (that broke eslint and the
      # Sentry bundler plugin in PR #14). Overrides in the root package.json
      # use bounded ^ ranges on purpose: open-ended >= let fast-uri and
      # protobufjs jump majors unnoticed. Anything red here is new and must
      # be triaged, not assumed known.
      - name: Audit (production deps, high+)
        run: pnpm audit --prod --audit-level high
